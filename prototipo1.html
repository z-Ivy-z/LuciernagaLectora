<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luciérnaga Lectora</title>
<style>
:root{
    --c1:#1E104E;
    --c2:#452E5A;
    --c3:#FF653F;
    --c4:#FFC85C;
    --c5:#EFD2B0;
    --c6:#547792;
    --c7:#1A3263;
}
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg,var(--c1),var(--c2));
    color:var(--c5);
}
header{
    position:sticky;
    top:0;
    background:rgba(30,16,78,0.9);
    backdrop-filter: blur(10px);
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}
.container{
    padding:20px;
}
.search-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
.search-bar input, .search-bar select{
    padding:10px;
    border:none;
    border-radius:8px;
}
.books{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}
.book{
    background:rgba(255,255,255,0.05);
    padding:15px;
    border-radius:15px;
    transition:0.3s;
    cursor:pointer;
}
.book:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.1);
    }
.status{
    font-size:12px;
    padding:5px;
    border-radius:5px;
}
.available{background:green;}
.borrowed{background:red;}
.reviews{
    margin-top:10px;
    font-size:12px;
}
button{
    background:var(--c3);
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    background:var(--c4);
    transform:scale(1.1);
    }
.floating-menu{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--c3);
    padding:15px;
    border-radius:50%;
    cursor:pointer;
}
@media(max-width:600px){
    header{font-size:18px;}
    }
</style>
</head>
<body>
<header>Luciérnaga Lectora ✨</header>

<div class="container">
    <div class="search-bar">
        <input type="text" id="searchTitle" placeholder="Buscar por título">
        <input type="text" id="searchAuthor" placeholder="Buscar por autor">
        <select id="searchRating">
        <option value="">Puntuación</option>
        <option value="5">5⭐</option>
        <option value="4">4⭐+</option>
        <option value="3">3⭐+</option>
        </select>
    </div>

    <div class="books" id="bookList"></div>
</div>

<div class="floating-menu" onclick="addBook()">＋</div>

<script>
class Book{
    constructor(title,author,edition,status,type){
        this.title=title;
        this.author=author;
        this.edition=edition;
        this.status=status;
        this.type=type;
        this.reviews=[];
    }
    addReview(user,stars,comment){
        const now=new Date();
        this.reviews.push({
        user,
        stars,
        comment,
        date:now.toLocaleDateString(),
        time:now.toLocaleTimeString()
        });
    }
    avgRating(){
        if(this.reviews.length===0) return 0;
        return (this.reviews.reduce((a,b)=>a+b.stars,0)/this.reviews.length).toFixed(1);
    }
}

let books=[
    new Book("Cien Años de Soledad","Gabriel García Márquez","Especial","Disponible","Pasta dura"),
    new Book("1984","George Orwell","Básica","Prestado","Pasta blanda")
];

books[0].addReview("Ana",5,"Increíble");
books[1].addReview("Luis",4,"Muy bueno");

function renderBooks(){
    const container=document.getElementById("bookList");
    container.innerHTML="";

    books.forEach(book=>{
        const div=document.createElement("div");
        div.className="book";

        div.innerHTML=`
        <h3>${book.title}</h3>
        <p><b>Autor:</b> ${book.author}</p>
        <p><b>Edición:</b> ${book.edition}</p>
        <p><b>Tipo:</b> ${book.type}</p>
        <span class="status ${book.status==='Disponible'?'available':'borrowed'}">${book.status}</span>
        <p>⭐ ${book.avgRating()}</p>
        <button onclick="addReviewPrompt('${book.title}')">Agregar reseña</button>
        <div class="reviews">
            ${book.reviews.map(r=>`<p>${r.user} (${r.date} ${r.time}) ⭐${r.stars}: ${r.comment}</p>`).join('')}
        </div>
        `;

        container.appendChild(div);
    });
}

function addReviewPrompt(title){
    const user=prompt("Usuario:");
    const stars=parseInt(prompt("Estrellas (1-5):"));
    const comment=prompt("Comentario:");

    const book=books.find(b=>b.title===title);
    if(book){
        book.addReview(user,stars,comment);
        renderBooks();
    }
}

function addBook(){
    const title=prompt("Título:");
    const author=prompt("Autor:");
    const edition=prompt("Edición:");
    const status=prompt("Disponible o Prestado:");
    const type=prompt("Pasta dura o blanda:");

    books.push(new Book(title,author,edition,status,type));
    renderBooks();
    }

// filtros

document.getElementById("searchTitle").addEventListener("input",filterBooks);
document.getElementById("searchAuthor").addEventListener("input",filterBooks);
document.getElementById("searchRating").addEventListener("change",filterBooks);

function filterBooks(){
    const title=document.getElementById("searchTitle").value.toLowerCase();
    const author=document.getElementById("searchAuthor").value.toLowerCase();
    const rating=document.getElementById("searchRating").value;

    const filtered=books.filter(b=>{
        return (
            b.title.toLowerCase().includes(title) &&
            b.author.toLowerCase().includes(author) &&
            (rating==="" || b.avgRating()>=rating)
        );
        });

    const container=document.getElementById("bookList");
    container.innerHTML="";

    filtered.forEach(book=>{
        const div=document.createElement("div");
        div.className="book";
        div.innerHTML=`<h3>${book.title}</h3>`;
        container.appendChild(div);
    });
}

renderBooks();
</script>
</body>
</html>
